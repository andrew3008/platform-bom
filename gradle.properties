# Gradle execution settings only.
#
# Dependency and release versions are NOT declared here. They are owned exclusively by
# platform-catalog/gradle/platform-catalog.versions.toml (architecture committee
# requirement). Re-introducing a *Version property here re-creates the version drift
# this build was refactored to eliminate.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
# org.gradle.caching is intentionally absent from the shared gradle.properties:
# remote build cache requires explicit infrastructure (Develocity / HTTP cache node).
# Enabling caching without a remote backend gives no benefit in CI (the local cache is
# not shared between runners) and may cause confusing cache-miss warnings.
# Enable per-developer via ~/.gradle/gradle.properties: org.gradle.caching=true
